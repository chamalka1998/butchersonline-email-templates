<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ButchersOnline.ca — Email Outreach Campaign</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#11213a; --paper:#f8f5ef; --line:rgba(19,34,55,.13); }
      * { box-sizing:border-box; }
      body { margin:0; min-width:320px; color:var(--ink); font-family:"DM Sans",Arial,sans-serif; background:radial-gradient(circle at 10% 38%,rgba(184,31,37,.055),transparent 22%),radial-gradient(circle at 88% 82%,rgba(16,103,57,.05),transparent 22%),var(--paper); }
      .masthead { min-height:142px; padding:25px 20px; color:#fff; text-align:center; display:grid; place-items:center; background:linear-gradient(105deg,rgba(21,27,35,.97),rgba(30,34,39,.9)),url("Images/Butcher_1.png") center/cover; position:relative; overflow:hidden; }
      .masthead::before,.masthead::after { content:""; position:absolute; width:220px; height:220px; border:2px solid rgba(255,255,255,.12); border-radius:50%; }
      .masthead::before { left:-105px; top:-112px; } .masthead::after { right:-105px; bottom:-135px; }
      .brand { position:relative; z-index:1; }
      .brand-name { display:flex; align-items:center; justify-content:center; gap:11px; font-size:35px; font-weight:700; letter-spacing:-1.7px; line-height:1; }
      .brand-name .cleaver { font-size:39px; transform:rotate(-18deg); display:inline-block; } .brand-name em { color:#ef3d3b; font-style:normal; }
      .brand-tagline { margin:13px 0 0; font-size:12px; letter-spacing:5px; font-weight:600; color:#fafafa; }
      main { width:min(1420px,calc(100% - 40px)); margin:0 auto; padding:30px 0 50px; }
      .intro { text-align:center; margin:0 auto 34px; }
      h1 { margin:0; font-size:clamp(27px,3.1vw,46px); letter-spacing:-2px; line-height:1.15; }
      .heading-icon { color:#c52d30; margin-right:11px; font-size:.9em; }
      .intro p { margin:10px auto 0; max-width:800px; font-size:clamp(14px,1.5vw,18px); color:#4d5765; }
      .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:25px; align-items:start; }
      .segment { --accent:#b7212b; --accent-dark:#921b24; --soft:#fae9e8; background:rgba(255,255,255,.86); border-radius:19px; overflow:hidden; box-shadow:0 9px 23px rgba(17,33,58,.1); border:1px solid rgba(255,255,255,.8); }
      .segment.b { --accent:#c77a00; --accent-dark:#a76100; --soft:#fff2d8; } .segment.c { --accent:#126e3b; --accent-dark:#0b552d; --soft:#e1f1e8; }
      .segment-header { min-height:122px; display:flex; align-items:center; gap:13px; padding:22px 22px 20px; color:#fff; background:linear-gradient(130deg,var(--accent-dark),var(--accent)); position:relative; overflow:hidden; }
      .segment-header::after { content:attr(data-mark); position:absolute; right:-4px; bottom:-30px; font-size:108px; opacity:.16; line-height:1; }
      .segment-icon { position:relative; z-index:1; width:53px; height:53px; display:grid; place-items:center; flex:0 0 auto; border-radius:50%; color:var(--accent); background:#fff; font-size:26px; box-shadow:0 3px 10px rgba(0,0,0,.15); }
      .segment-heading { position:relative; z-index:1; } .segment-heading h2 { margin:0; font-size:29px; letter-spacing:-1.2px; } .segment-heading p { margin:2px 0 0; font-size:14px; font-weight:600; }
      .email-list { padding:14px; display:grid; gap:10px; }
      .email { border:1px solid var(--line); background:#fff; border-radius:11px; overflow:hidden; }
      .email summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:49px 1fr 20px; gap:11px; align-items:center; padding:12px 14px; } .email summary::-webkit-details-marker { display:none; }
      .email summary::after { content:"›"; font-size:29px; font-weight:300; line-height:1; transition:transform .2s; } .email[open] summary::after { transform:rotate(90deg); }
      .mail-icon { width:40px; height:40px; display:grid; place-items:center; color:var(--accent-dark); background:var(--soft); border-radius:9px; font-size:22px; }
      .email h3 { margin:0; font-size:18px; line-height:1.15; color:#121b29; } .email p { margin:2px 0 0; font-size:12.5px; color:#445064; line-height:1.3; }
      .email-actions { padding:0 14px 14px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
      .language-switcher { display:grid; grid-template-columns:1fr 1fr; gap:7px; padding:0 14px 10px; }
      .language-button { padding:7px 8px; border:1px solid var(--line); border-radius:7px; color:#596273; background:#fff; cursor:pointer; font:700 11px "DM Sans",sans-serif; transition:.18s ease; }
      .language-button:hover,.language-button:focus { outline:none; border-color:var(--accent); color:var(--accent-dark); }
      .language-button[aria-pressed="true"] { color:#fff; border-color:var(--accent); background:var(--accent); }
      .preview[hidden] { display:none; }
      .preview { min-height:36px; display:flex; align-items:center; justify-content:center; gap:5px; padding:7px 5px; color:var(--accent-dark); background:#fff; border:1px solid var(--accent); border-radius:7px; text-decoration:none; font-size:11.5px; font-weight:700; white-space:nowrap; transition:.18s ease; }
      .preview:hover,.preview:focus { outline:none; transform:translateY(-1px); color:#fff; background:var(--accent); box-shadow:0 4px 9px color-mix(in srgb,var(--accent) 28%,transparent); } .preview.primary { color:#fff; background:var(--accent); } .preview.primary:hover { background:var(--accent-dark); }
      .all-open { margin:2px 14px 17px; width:calc(100% - 28px); border:0; border-radius:8px; padding:10px; color:var(--accent-dark); background:var(--soft); cursor:pointer; font:700 12px "DM Sans",sans-serif; transition:.18s; } .all-open:hover { background:var(--accent); color:#fff; }
      footer { margin:47px auto 0; display:flex; align-items:center; justify-content:center; gap:20px; color:#202c3a; font:italic 500 clamp(15px,2vw,21px) "Playfair Display",serif; text-align:center; } footer::before,footer::after { content:""; width:min(11vw,130px); height:1px; background:#7d8288; } footer span { color:#d52b2b; font-style:normal; }
      @media (max-width:1000px) { .grid { grid-template-columns:1fr; max-width:600px; margin:auto; } } @media (max-width:570px) { main { width:min(100% - 24px,500px); padding-top:23px; } .masthead { min-height:123px; } .brand-name { font-size:28px; } .brand-tagline { font-size:9px; letter-spacing:3px; } .segment-heading h2 { font-size:25px; } footer { gap:10px; } }
    </style>
  </head>
  <body>
    <header class="masthead"><div class="brand"><div class="brand-name"><span class="cleaver">▱</span> Butchers<em>Online.ca</em><span aria-hidden="true">✦</span></div><p class="brand-tagline">CANADA'S BUTCHER DIRECTORY &amp; MARKETPLACE</p></div></header>
    <main>
      <section class="intro"><h1><span class="heading-icon">✉</span>Email Outreach Campaign</h1><p>Create targeted email sequences to promote ButchersOnline.ca to butcher shops across Canada.</p></section>
      <section class="grid" id="segments" aria-label="Outreach email templates"></section>
      <footer><span>✦</span>Helping Canadian Butcher Shops Grow Online</footer>
    </main>
    <script>
      const segments = [
        { key:"a", name:"Segment A", icon:"♟", mark:"♟", label:"No Website / Basic Online Presence", copy:["Introduce ButchersOnline.ca and the opportunity.","Show key benefits and what’s included.","Share a success example and invite action."] },
        { key:"b", name:"Segment B", icon:"🛒", mark:"⌑", label:"Website / Basic E-commerce", copy:["Highlight additional exposure and leads.","Show how it complements their website.","Invite them to join with a limited-time offer."] },
        { key:"c", name:"Segment C", icon:"♛", mark:"↗", label:"Established E-commerce / Early Adopter", copy:["Introduce advanced benefits and new features.","Showcase broader reach and customer growth.","Invite them to partner and get started today."] }
      ];
      // V5 is intentionally omitted: those source templates are still placeholders.
      const versions = ["V1","V2","V3","V4","V1 FR","V2 FR","V3 FR","V4 FR"];
      const target = document.querySelector("#segments");
      target.innerHTML = segments.map(segment => `
        <article class="segment ${segment.key}">
          <header class="segment-header" data-mark="${segment.mark}"><div class="segment-icon">${segment.icon}</div><div class="segment-heading"><h2>${segment.name}</h2><p>${segment.label}</p></div></header>
          <div class="email-list">${segment.copy.map((description,index) => {
            const email = index + 1;
            return `<details class="email" open><summary><span class="mail-icon">✉</span><span><h3>Email ${email}</h3><p>${description}</p></span></summary><div class="language-switcher" aria-label="Choose email language"><button class="language-button" type="button" data-language="english" aria-pressed="true">English</button><button class="language-button" type="button" data-language="french" aria-pressed="false">Français</button></div><div class="email-actions">${versions.map((version,vIndex) => { const language = version.endsWith(" FR") ? "french" : "english"; const number = version.replace(" FR", "").replace("V", ""); const file = `template-v${number}${language === "french" ? "-FR" : ""}.html`; return `<a class="preview ${vIndex === 0 ? "primary" : ""}" data-language="${language}" ${language === "french" ? "hidden" : ""} href="email-${email}/segment-${segment.key}/${file}" target="_blank" rel="noopener">◉ Preview ${version}</a>`; }).join("")}</div></details>`;
          }).join("")}</div>
          <button class="all-open" type="button" aria-expanded="true">Hide preview buttons</button>
        </article>`).join("");
      document.querySelectorAll(".all-open").forEach(button => button.addEventListener("click", () => { const card = button.closest(".segment"); const expand = button.getAttribute("aria-expanded") === "false"; card.querySelectorAll("details").forEach(detail => detail.open = expand); button.setAttribute("aria-expanded", expand); button.textContent = expand ? "Hide preview buttons" : "Show all preview buttons"; }));
      document.querySelectorAll(".language-button").forEach(button => button.addEventListener("click", () => { const email = button.closest(".email"); const language = button.dataset.language; email.querySelectorAll(".language-button").forEach(item => item.setAttribute("aria-pressed", item === button)); email.querySelectorAll(".preview").forEach(link => link.hidden = link.dataset.language !== language); }));
    </script>
  </body>
</html>
